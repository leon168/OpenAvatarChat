default:
  logger:
    log_level: "INFO"
  service:
    host: "0.0.0.0"
    port: 8282
    cert_file: "ssl_certs/localhost.crt"
    cert_key: "ssl_certs/localhost.key"
  chat_engine:
    model_root: "models"
    concurrent_limit: 2
    handler_search_path:
      - "src/handlers"
    handler_configs:

      # === 打断处理器 ===
      InterruptHandler:
        enabled: True
        module: logic/interrupt/interrupt_handler

      # === 希灵 WebSocket 客户端 (接收外部文本输入，百度数字人兼容接口) ===
      XilingWebSocket:
        enabled: True
        module: client/xiling_ws/xiling_ws_handler
        path: "/ws/xiling"
        sample_rate: 16000
        connection_ttl: 3600
        # 流标识配置
        builder_id: "xiling"
        stream_id: "live"

      # === 希灵 TTS (百度流式语音合成) ===
      XilingTTS:
        enabled: True
        module: tts/xiling_tts/tts_handler_xiling
        auth_type: "api_key"  # 选项: api_key, access_token
        # 两种认证方式，选择一种：
        # 1. api_key 认证: 提供 API Key
        # 2. access_token 认证：提供 API Key 和 Secret Key
        api_key: ""  # 百度智能云 API Key，或设置环境变量 XILING_API_KEY
        secret_key: ""  # 百度智能云 Secret Key，或设置环境变量 XILING_SECRET_KEY
        access_token: ""  # 百度智能云访问令牌，或设置环境变量 XILING_ACCESS_TOKEN
        per: "5118"  # 发音人 ID，默认度小娇
        sample_rate: 16000  # 百度 TTS 输出 16kHz
        spd: 5  # 语速，0-15，默认5
        pit: 5  # 音调，0-15，默认5
        vol: 5  # 音量，0-15，默认5
        #aue: 3  # 音频编码格式，默认 3=mp3-16k/24k
        aue: 4  # 音频编码格式，4=pcm-16k/24k（代码按 raw int16 处理）

      # === 数字人渲染 ===
      AvatarMusetalk:
        module: avatar/musetalk/avatar_handler_musetalk
        fps: 25  # Video frame rate
        batch_size: 2  # Batch processing frame count, must be greater than 2
        avatar_video_path: "src/handlers/avatar/musetalk/MuseTalk/data/video/yongen.mp4"  # Initialization video path
        avatar_model_dir: "models/musetalk/avatar_model"  # Default avatar model directory
        force_create_avatar: false  # Whether to force regenerate digital human data
        debug: false  # Whether to enable debug mode
        multi_thread_inference: true  # Split UNet and VAE into separate threads for pipelined inference

      # === SRT 直播输出 (推流到 SRS) ===
      SRTOutput:
        enabled: True
        module: output/srt/srt_handler
        srt_url: "srt://127.0.0.1:10080?streamid=#!::r=live/avatar,m=publish"
        latency_ms: 120
        video_width: 594
        video_height: 1280
        fps: 25
        video_bitrate: 3000
        audio_sample_rate: 24000  # LiteAvatar 输出 24kHz
        audio_bitrate: 128
        preset: fast
        tune: zerolatency

